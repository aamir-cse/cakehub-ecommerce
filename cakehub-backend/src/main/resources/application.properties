vaadin.launch-browser=true
spring.application.name=cakehub-backend
spring.profiles.active=dev

# Standard Server Port
server.port=8080
# JWT Configuration
# Base64-encoded 256-bit secret key (CakeHubProductionGradeSecretKey2026SecureHMAC)
cakehub.jwt.secret=Q2FrZUh1YlByb2R1Y3Rpb25HcmFkZVNlY3JldEtleTIwMjZTZWN1cmVITUFD
# Access token expiration: 1 day in milliseconds (86400000)
cakehub.jwt.access-token-expiration-ms=86400000
# Refresh token expiration: 7 days in milliseconds (604800000)
cakehub.jwt.refresh-token-expiration-ms=604800000

#Image size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# For showing query
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
