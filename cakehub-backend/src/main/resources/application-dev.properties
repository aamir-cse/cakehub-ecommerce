# Development Profile (In-Memory H2 for local verification)
spring.datasource.url=jdbc:h2:mem:cakehub_dev_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=Aamir
spring.datasource.password=Password

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson Datetime Formatting
spring.jackson.time-zone=UTC

# JWT Configuration
# Base64-encoded 256-bit secret key (CakeHubProductionGradeSecretKey2026SecureHMAC)
cakehub.jwt.secret=Q2FrZUh1YlByb2R1Y3Rpb25HcmFkZVNlY3JldEtleTIwMjZTZWN1cmVITUFD
# Access token expiration: 1 day in milliseconds (86400000)
cakehub.jwt.access-token-expiration-ms=86400000
# Refresh token expiration: 7 days in milliseconds (604800000)
cakehub.jwt.refresh-token-expiration-ms=604800000